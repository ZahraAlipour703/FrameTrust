[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frametrust"
version = "0.1.0"
description = "A reproducible, camera-only robustness study for human-pose tracking under video degradation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<2.1",
  "pandas>=2.0",
  "opencv-contrib-python>=4.8,<5",
  "mediapipe>=0.10.14,<0.10.31",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
